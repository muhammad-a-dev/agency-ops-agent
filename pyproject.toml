[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agency-ops-agent"
version = "0.1.0"
description = "Tool-using agent API for agency operations automation demos"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Muhammad Ali", email = "muhammad@example.com" },
]
keywords = [
    "fastapi",
    "agent",
    "tools",
    "automation",
    "agency-ops",
    "portfolio",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.8.0",
]

[project.scripts]
agency-ops-agent = "agency_ops_agent.cli:main"

[project.urls]
Homepage = "https://github.com/muhammad-a-dev/agency-ops-agent"
Repository = "https://github.com/muhammad-a-dev/agency-ops-agent"
Issues = "https://github.com/muhammad-a-dev/agency-ops-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agency_ops_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/agency_ops_agent", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "N",
]
ignore = [
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["agency_ops_agent"]
